spring:
  application:
    name: accounting
  main:
    banner-mode: "off"
    web-application-type: none
  kafka:
    # KAFKA_ADDR is required (the .NET service failed to start without it)
    bootstrap-servers: ${KAFKA_ADDR}
    consumer:
      group-id: accounting
      # https://github.com/confluentinc/confluent-kafka-dotnet#basic-consumer-example
      auto-offset-reset: earliest
      enable-auto-commit: true
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

# DB_CONNECTION_STRING (Npgsql keyword/value format or a jdbc: URL) is read by DatabaseConfiguration;
# without it orders are only logged.
accounting:
  topic: ${KAFKA_TOPIC:orders}
