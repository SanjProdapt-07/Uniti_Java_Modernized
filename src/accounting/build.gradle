plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.2'
    id 'com.google.protobuf' version '0.10.1'
}

repositories {
    mavenCentral()
}

description = 'Accounting Service'
group = "accounting"
version = "0.1.0-SNAPSHOT"

def protocVersion = "4.36.2"
def opentelemetryInstrumentationVersion = "2.31.1"

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetryInstrumentationVersion}")

    implementation "org.springframework.boot:spring-boot-starter-kafka",
            // plain JDBC (no JPA): the service writes three small tables, see OrderStore. The starter also
            // enables the OpenTelemetry JDBC instrumentation, which is conditional on Spring Boot's
            // JDBC auto-configuration being on the classpath (the DataSource itself is built by
            // DatabaseConfiguration, so DataSourceAutoConfiguration is excluded).
            "org.springframework.boot:spring-boot-starter-jdbc",
            "com.google.protobuf:protobuf-java:${protocVersion}",
            "com.google.protobuf:protobuf-java-util:${protocVersion}",
            "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter",
            "io.opentelemetry.instrumentation:opentelemetry-kafka-clients-2.6:${opentelemetryInstrumentationVersion}-alpha",
            "io.opentelemetry.instrumentation:opentelemetry-spring-kafka-2.7:${opentelemetryInstrumentationVersion}-alpha",
            "io.opentelemetry.instrumentation:opentelemetry-jdbc:${opentelemetryInstrumentationVersion}-alpha",
            "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:${opentelemetryInstrumentationVersion}-alpha"

    runtimeOnly "org.postgresql:postgresql"

    testImplementation "org.springframework.boot:spring-boot-starter-kafka-test",
            "org.mockito:mockito-junit-jupiter",
            "io.opentelemetry:opentelemetry-sdk-testing",
            "org.awaitility:awaitility"
    testRuntimeOnly "com.h2database:h2",
            "org.junit.platform:junit-platform-launcher"
}

// Default protoSourceDir is in /opentelemetry-demo/pb. Optionally override the
// location for the docker build, which copies the protos to a different location.
def protoSourceDir = findProperty('protoSourceDir') ?: project.projectDir.parentFile.parentFile.toPath().toString() + "/pb"
def protoDestDir = layout.buildDirectory.dir("proto").get().asFile.toPath().toString()

// Copy protos to the build directory
tasks.register('copyProtos', Copy) {
    from protoSourceDir
    into protoDestDir
}

// Include the output directory of copyProtos in main source set so they are
// picked up by the protobuf plugin
sourceSets {
    main {
        proto {
            srcDir(protoDestDir)
        }
    }
}

// Only the message classes are needed (the .NET service used GrpcServices="none" as well).
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
}

afterEvaluate {
    // Ensure protos are copied before classes are generated
    tasks.getByName('processResources').dependsOn 'copyProtos'
    tasks.getByName('generateProto').dependsOn 'copyProtos'
    tasks.getByName('processProtoResources').dependsOn 'copyProtos'
}

// Downloads the dependencies during the Docker image build so that layer is cached and
// later builds only compile.
tasks.register('downloadRepos', Copy) {
    from configurations.compileClasspath
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('dependencies')
}

tasks.named('bootJar') {
    archiveFileName = 'accounting.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
