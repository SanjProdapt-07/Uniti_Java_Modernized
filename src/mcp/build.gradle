plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.2'
}

repositories {
    mavenCentral()
}

description = 'MCP Service'
group = "mcp"
version = "0.1.0-SNAPSHOT"

def opentelemetryInstrumentationVersion = "2.33.1"
// Spring AI 2.0.x is the release line built against Spring Boot 4.1 (its starters depend on Boot 4.1.2).
// 2.1.x targets Spring Boot 4.2.
def springAiVersion = "2.0.2"

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetryInstrumentationVersion}")
    implementation platform("org.springframework.ai:spring-ai-bom:${springAiVersion}")

    implementation "org.springframework.ai:spring-ai-starter-mcp-server-webmvc",
            "org.springframework.boot:spring-boot-starter-restclient",
            "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter"

    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test",
            "io.opentelemetry:opentelemetry-sdk-testing"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Downloads the dependencies during the Docker image build so that layer is cached and
// later builds only compile.
tasks.register('downloadRepos', Copy) {
    from configurations.compileClasspath
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('dependencies')
}

tasks.named('bootJar') {
    archiveFileName = 'mcp.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
