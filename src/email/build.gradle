plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.2'
}

repositories {
    mavenCentral()
}

description = 'Email Service'
group = "email"
version = "0.1.0-SNAPSHOT"

def opentelemetryInstrumentationVersion = "2.31.1"
def openFeatureSdkVersion = "1.23.0"
def flagdProviderVersion = "0.15.0"
def openFeatureOtelHookVersion = "3.3.1"

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetryInstrumentationVersion}")

    implementation "org.springframework.boot:spring-boot-starter-webmvc",
            "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter",
            "dev.openfeature:sdk:${openFeatureSdkVersion}",
            "dev.openfeature.contrib.providers:flagd:${flagdProviderVersion}",
            "dev.openfeature.contrib.hooks:otel:${openFeatureOtelHookVersion}"

    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test",
            "io.opentelemetry:opentelemetry-sdk-testing"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Downloads the dependencies during the Docker image build so that layer is cached and
// later builds only compile.
tasks.register('downloadRepos', Copy) {
    from configurations.compileClasspath
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('dependencies')
}

tasks.named('bootJar') {
    archiveFileName = 'email.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
