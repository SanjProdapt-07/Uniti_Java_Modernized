plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.2'
}

repositories {
    mavenCentral()
}

description = 'Quote Service'
group = "quote"
version = "0.1.0-SNAPSHOT"

def opentelemetryInstrumentationVersion = "2.31.1"

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetryInstrumentationVersion}")

    implementation "org.springframework.boot:spring-boot-starter-webmvc",
            "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter",
            // Exports application logs through the OpenTelemetry SDK (the PHP service used the
            // OpenTelemetry Monolog handler for the same purpose).
            "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:${opentelemetryInstrumentationVersion}-alpha"

    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test",
            "org.mockito:mockito-junit-jupiter",
            "io.opentelemetry:opentelemetry-sdk-testing",
            "org.awaitility:awaitility"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Downloads the dependencies during the Docker image build so that layer is cached and
// later builds only compile.
tasks.register('downloadRepos', Copy) {
    from configurations.compileClasspath
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('dependencies')
}

tasks.named('bootJar') {
    archiveFileName = 'quote.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
