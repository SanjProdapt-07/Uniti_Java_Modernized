plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.2'
    id 'com.google.protobuf' version '0.10.1'
}

repositories {
    mavenCentral()
}

description = 'Product Catalog Service'
group = "productcatalog"
version = "0.1.0-SNAPSHOT"

// protoc-gen-grpc-java, kept at the gRPC version the Spring Boot BOM manages for the runtime
def grpcVersion = "1.85.1"
def protocVersion = "4.36.2"
def opentelemetryInstrumentationVersion = "2.31.1"
def openFeatureSdkVersion = "1.23.0"
def flagdProviderVersion = "0.15.0"
def openFeatureOtelHookVersion = "3.3.1"
def opampClientVersion = "1.62.1-alpha"
def okHttpVersion = "5.5.1"

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetryInstrumentationVersion}")
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom-alpha:${opentelemetryInstrumentationVersion}-alpha")

    implementation "org.springframework.boot:spring-boot-starter-grpc-server",
            "org.springframework.boot:spring-boot-starter-jdbc",
            "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter",
            "io.opentelemetry.instrumentation:opentelemetry-grpc-1.6:${opentelemetryInstrumentationVersion}-alpha",
            // JDBC client spans (+ SQLCommenter) for the DataSource, and HikariCP pool metrics
            "io.opentelemetry.instrumentation:opentelemetry-jdbc",
            "io.opentelemetry.instrumentation:opentelemetry-hikaricp-3.0",
            // OTLP log export through the Logback appender
            "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0",
            // JVM runtime metrics
            "io.opentelemetry.instrumentation:opentelemetry-runtime-telemetry",
            "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure",
            "org.postgresql:postgresql",
            "com.google.protobuf:protobuf-java:${protocVersion}",
            "io.grpc:grpc-protobuf",
            "io.grpc:grpc-stub",
            "javax.annotation:javax.annotation-api:1.3.2",
            "dev.openfeature:sdk:${openFeatureSdkVersion}",
            "dev.openfeature.contrib.providers:flagd:${flagdProviderVersion}",
            "dev.openfeature.contrib.hooks:otel:${openFeatureOtelHookVersion}",
            // OpAMP client (health reporting to the demo's opamp-server)
            "com.squareup.okhttp3:okhttp:${okHttpVersion}"
    implementation("io.opentelemetry.contrib:opentelemetry-opamp-client:${opampClientVersion}") {
        // it declares a newer opentelemetry-api than the SDK the Spring Boot starter brings
        exclude group: 'io.opentelemetry', module: 'opentelemetry-api'
    }

    testImplementation "org.springframework.boot:spring-boot-starter-grpc-server-test",
            "io.opentelemetry:opentelemetry-sdk-testing",
            "com.h2database:h2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Default protoSourceDir is in /opentelemetry-demo/pb. Optionally override the
// location for the docker build, which copies the protos to a different location.
def protoSourceDir = findProperty('protoSourceDir') ?: project.projectDir.parentFile.parentFile.toPath().toString() + "/pb"
def protoDestDir = layout.buildDirectory.dir("proto").get().asFile.toPath().toString()

// Copy protos to the build directory
tasks.register('copyProtos', Copy) {
    from protoSourceDir
    into protoDestDir
}

// Include the output directory of copyProtos in main source set so they are
// picked up by the protobuf plugin
sourceSets {
    main {
        proto {
            srcDir(protoDestDir)
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protocVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks { task ->
        all()*.plugins {
            grpc {}
        }
        ofSourceSet('main')
    }
}

afterEvaluate {
    // Ensure protos are copied before classes are generated
    tasks.getByName('processResources').dependsOn 'copyProtos'
    tasks.getByName('generateProto').dependsOn 'copyProtos'
    tasks.getByName('processProtoResources').dependsOn 'copyProtos'
}

// Downloads the dependencies during the Docker image build so that layer is cached and
// later builds only compile.
tasks.register('downloadRepos', Copy) {
    from configurations.compileClasspath
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('dependencies')
}

tasks.named('bootJar') {
    archiveFileName = 'product-catalog.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
