plugins {
    id 'java'
    id 'idea'
    id 'org.springframework.boot' version '4.1.2'
}

repositories {
    mavenCentral()
}

description = 'Flagd UI Service'
group = "flagd-ui"
version = "0.1.1"

def opentelemetryInstrumentationVersion = "2.31.1"

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform("io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom:${opentelemetryInstrumentationVersion}")

    implementation "org.springframework.boot:spring-boot-starter-webmvc",
            "org.springframework.boot:spring-boot-starter-thymeleaf",
            "io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter",
            "io.opentelemetry.instrumentation:opentelemetry-spring-webmvc-6.0:${opentelemetryInstrumentationVersion}-alpha"

    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test",
            "org.springframework.boot:spring-boot-starter-thymeleaf-test",
            "org.mockito:mockito-junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

// Downloads the dependencies during the Docker image build so that layer is cached and
// later builds only compile.
tasks.register('downloadRepos', Copy) {
    from configurations.compileClasspath
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('dependencies')
}

tasks.named('bootJar') {
    archiveFileName = 'flagd-ui.jar'
}

tasks.named('test') {
    useJUnitPlatform()
}
